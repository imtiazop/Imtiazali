<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS Restaurant Manager - Cashier POS</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#eef1f5;
 color:#111827;
}

.topbar{
 background:#111827;
 color:white;
 padding:16px 24px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 position:sticky;
 top:0;
 z-index:1000;
 box-shadow:0 3px 15px #0002;
}

.topbar h2{
 margin:0;
 font-size:22px;
}

.pos{
 display:grid;
 grid-template-columns:minmax(0,1fr) 360px;
 gap:16px;
 padding:18px;
 width:100%;
 max-width:1600px;
 margin:auto;
}

.panel{
 background:white;
 border-radius:16px;
 padding:18px;
 box-shadow:0 3px 15px #0001;
 border:1px solid #e5e7eb;
}

.panel h3{
 margin:0 0 14px;
 font-size:18px;
}

.categories{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
 gap:12px;
}

.categories button{
 width:100%;
 min-height:72px;
 padding:12px;
 margin:0;
 border:1px solid #e5e7eb;
 border-radius:16px;
 background:#f8fafc;
 color:#111827;
 font-size:15px;
 font-weight:800;
 cursor:pointer;
 transition:.2s ease;
 box-shadow:0 3px 10px #0001;
}

.categories button:hover{
 transform:translateY(-2px);
 box-shadow:0 7px 18px #0002;
}

.categories button.active{
 background:#111827;
 color:white;
 border-color:#111827;
 transform:translateY(-2px);
}

.products{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
 gap:12px;
}

.product{
 min-height:110px;
 border:1px solid #e5e7eb;
 border-radius:15px;
 padding:15px;
 cursor:pointer;
 background:white;
 transition:.2s ease;
 box-shadow:0 2px 8px #0001;
}

.product:hover{
 transform:translateY(-3px);
 box-shadow:0 8px 20px #0002;
}

.product .name{
 font-weight:800;
 font-size:16px;
}

.price{
 margin-top:10px;
 font-weight:900;
 font-size:17px;
}

.stock{
 font-size:12px;
 color:#6b7280;
 margin-top:5px;
}

.cart-item,.pending{
 background:#f3f4f6;
 padding:11px;
 border-radius:10px;
 margin:7px 0;
}

.qty button{
 width:32px;
 padding:6px;
 margin:0 3px;
 border:0;
 border-radius:6px;
 cursor:pointer;
}

.total{
 font-size:24px;
 font-weight:900;
 margin:15px 0;
 padding-top:12px;
 border-top:1px solid #e5e7eb;
}

.mainbtn{
 width:100%;
 padding:14px;
 border:0;
 border-radius:12px;
 background:#16a34a;
 color:white;
 font-weight:800;
 font-size:16px;
 cursor:pointer;
}

.smallbtn{
 padding:8px;
 border:0;
 border-radius:7px;
 margin-top:5px;
 cursor:pointer;
}

/* ORDER DETAILS */
#customerName,
#customerPhone,
#orderType,
#tableNo,
#orderTakerName,
#orderTakerPhone,
#riderName,
#riderPhone,
#deliveryAddress,
#orderNotes{
 width:100%;
 border:1px solid #d1d5db;
 border-radius:10px;
 font-size:14px;
 outline:none;
}

#customerName,
#customerPhone,
#orderType,
#tableNo,
#orderTakerName,
#orderTakerPhone,
#riderName,
#riderPhone,
#deliveryAddress{
 padding:12px;
}

/* TABLET */
@media(max-width:1100px){
 .pos{
  grid-template-columns:minmax(0,1fr) 300px;
 }
 .categories{
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
 }
 .products{
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
 }
}

/* MOBILE */
@media(max-width:700px){
 .topbar{
  padding:13px 15px;
 }

 .topbar h2{
  font-size:18px;
 }

 .pos{
  grid-template-columns:1fr;
  padding:10px;
  gap:10px;
 }

 .panel{
  padding:13px;
  border-radius:13px;
 }

 .categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
 }

 .categories button{
  min-height:62px;
  font-size:14px;
 }

 .products{
  grid-template-columns:repeat(2,1fr);
  gap:8px;
 }

 .product{
  min-height:100px;
  padding:11px;
 }

 .right{
  grid-column:auto;
 }
}

/* SMALL PHONES */
@media(max-width:380px){
 .products{
  grid-template-columns:1fr 1fr;
 }

 .categories button{
  font-size:13px;
 }
}
</style>
</head>

<body>

<div id="cashierLoginScreen" style="
  min-height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  box-sizing:border-box;
  background:#f1f5f9;
">
  <div style="
    width:100%;
    max-width:400px;
    background:#fff;
    border-radius:20px;
    padding:25px;
    box-sizing:border-box;
    box-shadow:0 12px 35px rgba(15,23,42,.12);
    text-align:center;
  ">

    <div style="font-size:42px;">🔐</div>

    <div id="cashierTillTitle" style="
      margin-top:8px;
      font-size:24px;
      font-weight:900;
      color:#111827;
    ">
      Cashier
    </div>

    <div style="
      margin-top:5px;
      color:#64748b;
      font-size:13px;
    ">
      Enter your Lock Code / PIN
    </div>

    <input id="cashierTillPin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="🔢 Lock Code / PIN"
      style="
        width:100%;
        padding:15px;
        margin-top:20px;
        border:1px solid #cbd5e1;
        border-radius:12px;
        box-sizing:border-box;
        font-size:18px;
        text-align:center;
        letter-spacing:4px;
      ">

    <button onclick="cashierLogin()" style="
      width:100%;
      padding:15px;
      margin-top:12px;
      border:0;
      border-radius:12px;
      background:#111827;
      color:#fff;
      font-weight:900;
      font-size:16px;
    ">
      🔓 UNLOCK CASHIER
    </button>

    <div id="cashierLoginMessage" style="
      margin-top:12px;
      min-height:20px;
      font-size:13px;
      font-weight:800;
    "></div>

  </div>
</div>

<div class="pos" id="cashierPOS" style="display:none;">

<!-- ORDER DETAILS FIRST -->
<div class="panel" style="grid-column:1/-1">
 <h3>📝 Order Details</h3>

 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px">

  <input id="customerName" placeholder="👤 Customer Name">

  <input id="customerPhone" placeholder="📱 Customer Phone">

  <select id="orderType" onchange="toggleOrderFields()">
   <option value="Dine-In">🍽️ Dine-In</option>
   <option value="Takeaway">🥡 Takeaway</option>
   <option value="Home Delivery">🏠 Home Delivery</option>
  </select>

  <input id="tableNo" placeholder="🪑 Table No.">

  <select id="orderTakerName">
   <option value="">👨‍💼 Select Order Taker / Tracker</option>
  </select>

  <input id="orderTakerPhone" placeholder="📞 Order Taker Phone">

  <input id="riderName" placeholder="🛵 Rider Name">

  <input id="riderPhone" placeholder="📞 Rider Phone">

  <input id="deliveryAddress"
         placeholder="🏠 Delivery Address"
         style="grid-column:1/-1">

  <textarea id="orderNotes"
            placeholder="📝 Special Instructions / Notes"
            style="padding:12px;min-height:70px;grid-column:1/-1"></textarea>

 </div>
</div>


<!-- ===== PROFESSIONAL POS WORKSPACE ===== -->

<div class="posWorkspace">

 <!-- LEFT: RUNNING ORDERS -->
 <div class="panel runningPanel">
  <h3>🔄 Running Orders</h3>
  <div id="pendingOrders">No running orders</div>
 </div>

 <!-- CENTER: CATEGORIES + PRODUCTS -->
 <div class="centerWorkspace">

  <div class="panel categoriesPanel">
   <h3>📂 Categories</h3>
   <div id="categories" class="categories"></div>
  </div>

  <div class="panel productsPanel">
   <h3 id="categoryTitle">🍽️ Select a Category</h3>
   <input id="productSearch" type="text" placeholder="🔎 Search product..." autocomplete="off">
   <div id="products" class="products">
    Select a category to view products
   </div>
  </div>

 </div>

 <!-- RIGHT: CURRENT ORDER -->
 <div class="panel currentOrderPanel">
  <h3>🛒 Current Order</h3>

  <div id="cart">Cart empty</div>

  <div class="total">
   Total: Rs. <span id="total">0</span>
  </div>

  <button class="mainbtn" onclick="placeOrder()">
   🟢 Place Order
  </button>
 </div>

</div>

<!-- END POS WORKSPACE --></div></div>

<script>

function cashierAuthHeaders(){
 const token=sessionStorage.getItem("cashier_till_session");

 return token
  ? {"Authorization":"Bearer "+token}
  : {};
}

async function cashierLogin(){

  const pin=document.getElementById("cashierTillPin")?.value.trim();
  const msg=document.getElementById("cashierLoginMessage");

  if(!pin){
    if(msg){
      msg.style.color="#b91c1c";
      msg.textContent="❌ Lock Code / PIN required hai.";
    }
    return;
  }

  if(msg){
    msg.style.color="#475569";
    msg.textContent="⏳ PIN checking...";
  }

  try{

    const params=new URLSearchParams(window.location.search);
    const tillId=params.get("till");

    if(!tillId){
      if(msg){
        msg.style.color="#b91c1c";
        msg.textContent="❌ Cashier Till identify nahi hua.";
      }
      return;
    }

    const r=await fetch("/api/cashier-till-login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        till_id:Number(tillId),
        lock_code:pin
      })
    });

    const data=await r.json();

    if(!r.ok || !data.success){
      if(msg){
        msg.style.color="#b91c1c";
        msg.textContent="❌ "+(data.error||"Login failed");
      }
      return;
    }

    sessionStorage.setItem(
      "cashier_till_session",
      data.token || ""
    );

    sessionStorage.setItem(
      "cashier_till_id",
      String(data.till.id)
    );

    sessionStorage.setItem(
      "cashier_till_name",
      data.till.till_name
    );

    const title=document.getElementById("cashierTillTitle");

    if(title){
      title.textContent=data.till.till_name;
    }

    const loginScreen=document.getElementById("cashierLoginScreen");
    const cashierPOS=document.getElementById("cashierPOS");

    if(cashierPOS){
      cashierPOS.style.display="grid";
    }

    if(loginScreen){
      loginScreen.style.display="none";
    }

    if(msg){
      msg.textContent="";
    }

    await loadCashierBusinessDay();

    if(typeof loadProducts==="function"){
      await loadProducts();
    }

  }catch(e){

    console.error("CASHIER TILL LOGIN ERROR:",e);

    if(msg){
      msg.style.color="#b91c1c";
      msg.textContent="⚠️ Server connection failed.";
    }
  }
}

let products=[];
let cart=[];
let pendingOrders=[];
let selectedCategory="All";

async function loadProducts(){

 const el=document.getElementById("categories");

 if(el) el.innerHTML='<div style="padding:15px;font-weight:800;">⏳ LOADING CATEGORIES...</div>';

 try{

  const r=await fetch("/api/products?restaurant_id=1");

  if(!r.ok) throw new Error("API HTTP " + r.status);

  products=await r.json();

  if(el) el.innerHTML='<div style="padding:15px;font-weight:800;">✅ PRODUCTS: '+products.length+' — BUILDING CATEGORIES...</div>';

  buildCategories();
  showProducts();

 }catch(err){

  if(el) el.innerHTML='<div style="padding:15px;background:#fee2e2;color:#991b1b;border-radius:12px;font-weight:800;">❌ ERROR: '+err.message+'</div>';

 }
}

function buildCategories(){

 const categories=["All",...new Set(
   products.map(p=>p.category||"Others")
 )];

 let html="";

 categories.forEach(category=>{
  html+=`
   <button
    class="${selectedCategory===category?"active":""}"
    onclick="selectCategory('${escapeHtml(category)}')">
    ${category==="All"?"🍽️ ":""}${escapeHtml(category)}
   </button>
  `;
 });

 document.getElementById("categories").innerHTML=html;
}

function selectCategory(category){

 selectedCategory=category;

 document.getElementById("categoryTitle").textContent=
  category==="All" ? "🍽️ All Products" : "📦 "+category;

 buildCategories();
 showProducts();
}

function showProducts(){

 const list=selectedCategory==="All"
  ? products
  : products.filter(p=>
      (p.category||"Others")===selectedCategory
    );

 let html="";

 list.forEach(p=>{
  html+=`
   <div class="product" onclick="addItem(${p.id})">
    <div class="name">${escapeHtml(p.name)}</div>
    <div class="price">Rs. ${Number(p.price)}</div>
    <div class="stock">Stock: ${Number(p.stock)}</div>
   </div>
  `;
 });

 document.getElementById("products").innerHTML=
  html || "No products in this category";
}

function addItem(id){

 const p=products.find(x=>x.id===id);

 if(!p) return;

 const existing=cart.find(x=>x.product_id===id);

 if(existing){

  if(existing.qty+1>p.stock){
   alert("❌ Stock available nahi hai");
   return;
  }

  existing.qty++;
 }else{

  if(Number(p.stock)<1){
   alert("❌ Product out of stock");
   return;
  }

  cart.push({
   product_id:p.id,
   name:p.name,
   price:Number(p.price),
   qty:1
  });
 }

 renderCart();
}

function changeQty(index,change){

 const item=cart[index];
 const p=products.find(x=>x.id===item.product_id);

 item.qty+=change;

 if(item.qty<1){
  cart.splice(index,1);
 }

 if(p && item.qty>p.stock){
  item.qty=p.stock;
 }

 renderCart();
}

function removeItem(index){

 cart.splice(index,1);
 renderCart();
}

function renderCart(){

 let total=0;
 let html="";

 cart.forEach((item,index)=>{

  const amount=item.price*item.qty;
  total+=amount;

  html+=`
   <div class="cart-item">

    <b>${escapeHtml(item.name)}</b><br>

    Rs. ${item.price} × ${item.qty}
    = <b>Rs. ${amount}</b>

    <div class="qty">
     <button onclick="changeQty(${index},-1)">−</button>
     ${item.qty}
     <button onclick="changeQty(${index},1)">+</button>

     <button onclick="removeItem(${index})">
      ❌
     </button>
    </div>

   </div>
  `;
 });

 document.getElementById("cart").innerHTML=
  html || "Cart empty";

 document.getElementById("total").textContent=total;
}


function toggleOrderFields(){

 const type=document.getElementById("orderType").value;

 const table=document.getElementById("tableNo");
 const rider=document.getElementById("riderName");
 const riderPhone=document.getElementById("riderPhone");
 const address=document.getElementById("deliveryAddress");

 table.style.display=type==="Dine-In" ? "block" : "none";

 const delivery=type==="Home Delivery";

 rider.style.display=delivery ? "block" : "none";
 riderPhone.style.display=delivery ? "block" : "none";
 address.style.display=delivery ? "block" : "none";
}

async function placeOrder(){

 try{
  const dayCheck=await fetch("/api/business-day?restaurant_id=1");
  const day=await dayCheck.json();

  if(!day || day.status!=="OPEN"){
   alert("🔴 Day Start نہیں ہوا۔ پہلے Manager Panel سے Day Start کریں۔");
   await loadCashierBusinessDay();
   return;
  }
 }catch(e){
  alert("⚠️ Business Day status check failed.");
  return;
 }

 if(cart.length===0){
  alert("❌ Pehle products add karo");
  return;
 }

 const total=cart.reduce(
  (sum,item)=>sum+(item.price*item.qty),0
 );

 const now=Date.now();

 const order={
  id:now,

  invoiceNo:"INV-"+now,
  orderNo:"",

  customerName:document.getElementById("customerName")?.value.trim() || "",
  customerPhone:document.getElementById("customerPhone")?.value.trim() || "",

  orderType:document.getElementById("orderType")?.value || "Dine-In",
  tableNo:document.getElementById("tableNo")?.value.trim() || "",

  orderTakerName:document.getElementById("orderTakerName")?.value.trim() || "",
  orderTakerPhone:document.getElementById("orderTakerPhone")?.value.trim() || "",

  riderName:document.getElementById("riderName")?.value.trim() || "",
  riderPhone:document.getElementById("riderPhone")?.value.trim() || "",

  deliveryAddress:document.getElementById("deliveryAddress")?.value.trim() || "",
  notes:document.getElementById("orderNotes")?.value.trim() || "",

  items:JSON.parse(JSON.stringify(cart)),
  total:total,
  time:new Date().toLocaleTimeString()
 };

 try{

  const r=await fetch("/api/running-orders",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    ...cashierAuthHeaders()
   },
   body:JSON.stringify({
    restaurant_id:1,
    invoice_no:order.invoiceNo,
    order_no:order.orderNo,

    customer_name:order.customerName,
    customer_phone:order.customerPhone,

    order_type:order.orderType,
    table_no:order.tableNo,

    order_taker_name:order.orderTakerName,
    order_taker_phone:order.orderTakerPhone,

    rider_name:order.riderName,
    rider_phone:order.riderPhone,

    delivery_address:order.deliveryAddress,
    notes:order.notes,

    items:order.items,
    total:order.total
   })
  });

  const data=await r.json();

  if(!r.ok || !data.success){
   alert("❌ Order save nahi hua\n"+(data.error||"Unknown error"));
   return;
  }

  order.id=Number(data.order_id);
  order.invoiceNo=data.invoice_no || order.invoiceNo;
  order.orderNo=data.order_no || order.orderNo;

  pendingOrders.unshift(order);

  cart=[];

  renderCart();
  renderPendingOrders();

  document.getElementById("customerName").value="";
  document.getElementById("customerPhone").value="";
  document.getElementById("tableNo").value="";
  document.getElementById("orderTakerName").value="";
  document.getElementById("orderTakerPhone").value="";
  document.getElementById("riderName").value="";
  document.getElementById("riderPhone").value="";
  document.getElementById("deliveryAddress").value="";
  document.getElementById("orderNotes").value="";

  alert(
   "✅ Order Running mein save ho gaya\n\n"+
   "Invoice: "+order.invoiceNo+"\n"+
   "Order: "+order.orderNo
  );

 }catch(error){

  alert("❌ Server connection error\n"+error.message);

 }
}


async function loadRunningOrders(){

 try{

  const r=await fetch("/api/running-orders?restaurant_id=1",{headers:cashierAuthHeaders()});

  const data=await r.json();

  if(!r.ok || !Array.isArray(data)){
   console.error("Running orders load failed",data);
   return;
  }

  pendingOrders=data.map(order=>({
   id:order.id,
   invoiceNo:order.invoice_no,
   orderNo:order.order_no,
   customerName:order.customer_name || "",
   customerPhone:order.customer_phone || "",
   orderType:order.order_type || "",
   tableNo:order.table_no || "",
   orderTakerName:order.order_taker_name || "",
   orderTakerPhone:order.order_taker_phone || "",
   riderName:order.rider_name || "",
   riderPhone:order.rider_phone || "",
   deliveryAddress:order.delivery_address || "",
   notes:order.notes || "",
   items:Array.isArray(order.items) ? order.items : [],
   total:Number(order.total)||0,
   time:order.created_at || ""
  }));

  renderPendingOrders();

 }catch(error){

  console.error("Running orders error:",error);

 }

}

function renderPendingOrders(){

 let html="";

 pendingOrders.forEach(order=>{

  let items=order.items.map(item=>
   `${escapeHtml(item.name)} × ${item.qty}`
  ).join("<br>");

  html+=`
   <div class="pending">

    <b>🧾 Order #${String(order.id).slice(-4)}</b>

    <div style="font-size:12px;margin:5px 0">
     ${order.time}
    </div>

    ${items}

    <hr>

    <b>Total: Rs. ${order.total}</b>

    <button class="smallbtn"
     onclick="printBill(${order.id})">
     🖨️ Print Bill
    </button>

    <button class="smallbtn"
     style="background:#16a34a;color:white"
     onclick="cashOut(${order.id})">
     💵 Cash Out
    </button>

   </div>
  `;
 });

 document.getElementById("pendingOrders").innerHTML=
  html || "No running orders";
}

function printBill(id){

 const order=pendingOrders.find(x=>x.id===id);

 if(!order) return;

 const isThermal=true;

 let rows="";

 order.items.forEach(item=>{
  rows+=`
   <tr>
    <td>${escapeHtml(item.name)}</td>
    <td>${item.qty}</td>
    <td>Rs. ${item.price}</td>
    <td>Rs. ${item.price*item.qty}</td>
   </tr>
  `;
 });

 const w=window.open("","_blank");

 if(!w){
  alert("❌ Popup blocked hai");
  return;
 }

 w.document.write(`

 ${isThermal
  ? "size:80mm auto; margin:0;"

 font-size:${isThermal ? "11px" : "14px"};
}

 ${isThermal

  : "width:100%; min-height:277mm; margin:auto;"}
}

 text-align:center;
 border-bottom:2px solid #000;
 padding-bottom:10px;
}

 font-size:${isThermal ? "20px" : "30px"};
 font-weight:bold;
}

.meta{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px 20px;
 margin:15px 0;
 line-height:1.5;
}

 border-top:1px dashed #000;
 margin:10px 0;
}

table{

th:nth-child(n+2),
td:nth-child(n+2){

}

.total{

function calculateChange(total){

 const input=document.getElementById("cashReceived");
 const output=document.getElementById("cashChange");

 if(!input || !output) return;

 const received=Number(input.value)||0;
 const change=received-Number(total);

 output.textContent=
  "Rs. "+Math.max(change,0).toLocaleString();

 if(received>0 && received<Number(total)){
  output.textContent="Rs. 0 — Amount kam hai";
 }
}


async function submitCashPayment(id){

 if(window.cashOutProcessing){
  return;
 }

 const order=pendingOrders.find(x=>x.id===id);

 if(!order) return;

 window.cashOutProcessing=true;

 const input=document.getElementById("cashReceived");
 const received=Number(input?.value)||0;

 if(received<Number(order.total)){
  window.cashOutProcessing=false;
  alert(
   "❌ Customer se kam amount receive hua hai.\n"+
   "Required: Rs. "+order.total
  );
  return;
 }

 const modal=document.getElementById("cashPaymentModal");
 if(modal) modal.remove();

 await completeCashOut(
  id,
  "Cash",
  received-Number(order.total)
 );
}


async function completeCashOut(id,paymentMethod,changeAmount=0,paymentReference=""){

 const order=pendingOrders.find(x=>x.id===id);

 if(!order) return;

 try{

  const r=await fetch("/api/sales",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    ...cashierAuthHeaders()
   },
   body:JSON.stringify({
    restaurant_id:1,
    items:order.items,
    total:order.total,
    payment_method:paymentMethod,
    payment_reference:paymentReference
   })
  });

  const data=await r.json();

  if(!data.success){
   window.cashOutProcessing=false;
   alert(
    "❌ Cash Out failed\n"+
    (data.error||"Unknown error")
   );
   return;
  }

  const remove=await fetch(
   "/api/running-orders/"+order.id,
   {
     method:"DELETE",
     headers:cashierAuthHeaders()
    }
  );

  if(!remove.ok){
   alert("⚠️ Sale save ho gayi, lekin Running Order remove nahi hua.");
  }

  pendingOrders=pendingOrders.filter(
   x=>x.id!==id
  );

  renderPendingOrders();

  await loadProducts();

  showCashOutSuccess(
   order,
   paymentMethod,
   changeAmount
  );

  window.cashOutProcessing=false;

 }catch(error){

  alert(
   "❌ Server connection error\n"+
   error.message
  );

 }
}

function escapeHtml(value){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

});

<script>
/* ===== LOAD ORDER TAKER / TRACKER NAMES ===== */

async function loadOrderTakerDropdown(){

  const select=document.getElementById("orderTakerName");
  if(!select) return;

  const current=select.value;

  try{

    const r=await fetch("/api/order-takers?restaurant_id=1");
    const list=await r.json();

    if(!Array.isArray(list)) return;

    select.innerHTML=`
      <option value="">👨‍💼 Select Order Taker / Tracker</option>
    `;

    list.forEach(x=>{
      const option=document.createElement("option");
      option.value=x.name;
      option.textContent="👤 "+x.name;
      option.dataset.phone=x.phone||"";
      select.appendChild(option);
    });

    if(current){
      const found=[...select.options].find(o=>o.value===current);
      if(found) select.value=current;
    }

  }catch(e){
    console.error("Order Taker load error:",e);
  }
}


/* Auto-fill phone when a saved Order Taker is selected */
document.addEventListener("change",function(e){

  if(e.target.id!=="orderTakerName") return;

  const option=e.target.options[e.target.selectedIndex];
  const phone=option?.dataset?.phone||"";
  const phoneBox=document.getElementById("orderTakerPhone");

  if(phoneBox && phone){
    phoneBox.value=phone;
  }
});


/* Load when Cashier page opens */
document.addEventListener("DOMContentLoaded",function(){
  loadOrderTakerDropdown();
});
</script>
